```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Selector</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111827, #1e3a8a);
            color: white;
        }

        .container {
            width: 90%;
            max-width: 450px;
            padding: 40px;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #d1d5db;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            text-align: center;
            outline: none;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }

        .unlock {
            background: #2563eb;
            color: white;
        }

        .unlock:hover {
            background: #1d4ed8;
        }

        .website {
            background: white;
            color: #111827;
        }

        .website:hover {
            background: #e5e7eb;
            transform: translateY(-2px);
        }

        #selector {
            display: none;
        }

        #error {
            color: #fca5a5;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- LOGIN -->
        <div id="login">
            <h1>🔐 Enter Code</h1>
            <p>Enter your access code to continue.</p>

            <input
                type="password"
                id="code"
                placeholder="Enter code"
                maxlength="4"
                onkeydown="if(event.key === 'Enter') checkCode()"
            >

            <button class="unlock" onclick="checkCode()">
                Unlock
            </button>

            <div id="error">
                Incorrect code. Please try again.
            </div>
        </div>

        <!-- WEBSITE SELECTOR -->
        <div id="selector">
            <h1>Choose Website</h1>
            <p>Select which website you want to open.</p>

            <!-- CHANGE THESE FILENAMES IF NEEDED -->
            <button class="website" onclick="openWebsite('website1.html')">
                🌐 Website 1
            </button>

            <button class="website" onclick="openWebsite('website2.html')">
                🌐 Website 2
            </button>
        </div>

    </div>

    <script>
        const ACCESS_CODE = "6767";

        function checkCode() {
            const enteredCode = document.getElementById("code").value;
            const error = document.getElementById("error");

            if (enteredCode === ACCESS_CODE) {
                document.getElementById("login").style.display = "none";
                document.getElementById("selector").style.display = "block";
                error.style.display = "none";
            } else {
                error.style.display = "block";
                document.getElementById("code").value = "";
                document.getElementById("code").focus();
            }
        }

        function openWebsite(filename) {
            window.location.href = filename;
        }
    </script>

</body>
</html>
